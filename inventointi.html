<div class="app" id="app"></div>
<script>
/* ═══════════ WORKERS ═══════════ */
const WORKERS=[
  'Abdulhalim A.','Aada K.','Alaa H.','Anton T.','Dilgash O.',
  'Elsa H.','Farah D.','Henri H.','Ida J.','Jenni L.','Jesperi H.',
  'Jim W.','Johanna L.','Khadija M.','Lubna A.','Mikael T.',
  'Milla S.','Mio R.','Nea H.','Ninni T.','Robert J.','Tilda T.'
].sort();
let currentWorker=localStorage.getItem('inventointi_worker')||'';

/* ═══════════ FIREBASE ═══════════ */
firebase.initializeApp({apiKey:"AIzaSyBA_nMeugv0lSxjVm1il1iJo7v33Fs__X8",authDomain:"hyllytysappi.firebaseapp.com",databaseURL:"https://hyllytysappi-default-rtdb.europe-west1.firebasedatabase.app",projectId:"hyllytysappi",storageBucket:"hyllytysappi.firebasestorage.app",messagingSenderId:"312430303554",appId:"1:312430303554:web:1fa95efa74fa370bdc10db"});
const db=firebase.database();
function todayKey(){return new Date().toISOString().slice(0,10)}
const invRef=db.ref('inventointi/'+todayKey());

// Save a single counted item to Firebase
function fbSaveCount(vnr,qty,name,location,expected){
  invRef.child('counted/'+vnr).set({qty,name,location,expected,worker:currentWorker,t:Date.now()});
}
function fbDeleteCount(vnr){
  invRef.child('counted/'+vnr).remove();
}
// Save product list (once, when files loaded)
function fbSaveProducts(products){
  const data={};
  products.forEach(p=>{data[p.vnr]={name:p.name,ean:p.ean||'',location:p.location,expected:p.expected,saldo:p.saldo,unshipped:p.unshipped}});
  invRef.child('products').set(data);
}

// Listen for real-time updates (for view mode and multi-device)
let fbCounted={};
let viewMode=new URLSearchParams(window.location.search).get('view')==='erot';
let fbProducts={};
let fbDataLoaded={counted:false,products:false};

invRef.child('counted').on('value',snap=>{
  fbCounted=snap.val()||{};
  fbDataLoaded.counted=true;
  if(S.products){
    for(const vnr in fbCounted){
      S.allCounted[vnr]=fbCounted[vnr].qty;
    }
  }
  if(viewMode||S.phase==='deviations')render();
},err=>{fbDataLoaded.counted=true;if(viewMode)render()});

invRef.child('products').on('value',snap=>{
  fbProducts=snap.val()||{};
  fbDataLoaded.products=true;
  if(viewMode)render();
},err=>{fbDataLoaded.products=true;if(viewMode)render()});

/* ═══════════ ROUTE (same as hyllytysappi) ═══════════ */
const PR=[{id:"L1",asc:1},{id:"FA",asc:1},{id:"L2",asc:0},{id:"L3",asc:1},{id:"L4",asc:0},{id:"L5",asc:1},{id:"A2",asc:0},{id:"A3",asc:1},{id:"A4",asc:0},{id:"A5",asc:1},{id:"A6",asc:0},{id:"A1",asc:1},{id:"A7",asc:0},{id:"B1",asc:1},{id:"B2",asc:0},{id:"B3",asc:1},{id:"B4",asc:0},{id:"UU",asc:1}];
const PO=PR.map(p=>p.id);
function aisleIdx(a){const i=PO.indexOf(a);return i===-1?999:i}
function aisleAsc(a){const p=PR.find(x=>x.id===a);return p?p.asc:1}

function pLoc(l){
  if(!l||typeof l!=='string')return null;
  const t=l.trim();if(!t)return null;
  const p=t.split('-');
  if(p.length===4)return{aisle:p[0],shelf:p[1],level:p[2],pos:p[3],raw:t,shelfKey:p[0]+'-'+p[1]};
  if(p.length===3)return{aisle:p[0],shelf:p[1],level:p[2],pos:'0',raw:t,shelfKey:p[0]+'-'+p[1]};
  return null;
}

function sortByRoute(items){
  return[...items].sort((a,b)=>{
    if(!a.loc&&!b.loc)return 0;if(!a.loc)return 1;if(!b.loc)return-1;
    const ai=aisleIdx(a.loc.aisle),bi=aisleIdx(b.loc.aisle);
    if(ai!==bi)return ai-bi;
    const asc=aisleAsc(a.loc.aisle);
    const s=a.loc.shelf.localeCompare(b.loc.shelf,undefined,{numeric:1});if(s)return asc?s:-s;
    const l=a.loc.level.localeCompare(b.loc.level);if(l)return asc?l:-l;
    const p=a.loc.pos.localeCompare(b.loc.pos,undefined,{numeric:1});return asc?p:-p;
  });
}

/* ═══════════ STATE ═══════════ */
let S={
  phase:'setup',products:null,shelves:null,
  selectedShelf:null,shelfItems:null,currentIdx:0,
  counted:{},error:null,result:null,
  allCounted:{},camConfirmed:false,
  device:localStorage.getItem('inventointi_device')||''
};
let undoStack=[];

// Prevent accidental page refresh
window.addEventListener('beforeunload',function(e){
  if(S.phase==='counting'||S.phase==='shelfSelect'){e.preventDefault();e.returnValue='Inventointi on kesken.'}
});

function setState(u){Object.assign(S,u);render()}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ═══════════ CSV PARSING ═══════════ */
function parseMaxx(text){
  // InventointialustaXRP: semicolon, latin1, 3 header rows, columns at indices: 0=name, 3=VNR, 4=location, 10=saldo
  const lines=text.replace(/\r/g,'').split('\n');
  const data={};
  for(let i=3;i<lines.length;i++){
    const cols=lines[i].split(';');
    if(cols.length<11)continue;
    const name=cols[0].trim();
    const vnr=cols[3].trim();
    const location=cols[4].trim();
    const saldoStr=cols[10].trim().replace(',','.');
    const saldo=parseFloat(saldoStr)||0;
    if(!vnr)continue;
    data[vnr]={name,vnr,location,saldo};
  }
  return data;
}

function parseMagento(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const r=Papa.parse(text,{header:true,skipEmptyLines:true});
  const data={};
  r.data.forEach(row=>{
    const sku=String(row.sku||'').trim().replace(/"/g,'');
    const unshipped=parseFloat(String(row.qty_unshipped||'0').replace(',','.'))||0;
    if(sku)data[sku]={unshipped};
  });
  return data;
}

function parseProductRegister(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const r=Papa.parse(text,{header:true,skipEmptyLines:true});
  const data={};
  const cols=r.meta?.fields||[];
  const skuCol=cols.find(c=>c.replace(/^\uFEFF/,'').toLowerCase()==='sku')||'sku';
  const eanCol=cols.find(c=>c.toLowerCase()==='ean')||'ean';
  r.data.forEach(row=>{
    const sku=String(row[skuCol]||'').trim();
    const ean=String(row[eanCol]||'').trim();
    if(sku&&ean&&ean!=='null')data[sku]=ean;
  });
  return data;
}

/* ═══════════ MERGE & LOAD ═══════════ */
function loadFiles(){
  const maxxInput=document.getElementById('maxx-file');
  const magInput=document.getElementById('mag-file');
  const eanInput=document.getElementById('ean-file');
  if(!maxxInput.files.length||!magInput.files.length){setState({error:'Valitse molemmat tiedostot'});return}
  
  setState({error:null,result:{type:'ok',text:'Ladataan...'}});
  
  const readers=[];
  // Read Maxx (latin1)
  readers.push(new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsText(maxxInput.files[0],'iso-8859-15')}));
  // Read Magento (utf-8)
  readers.push(new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsText(magInput.files[0],'utf-8')}));
  // Read EAN file if provided
  if(eanInput.files.length){
    readers.push(new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsText(eanInput.files[0],'utf-8')}));
  } else {
    readers.push(Promise.resolve(null));
  }
  
  Promise.all(readers).then(async([maxxText,magText,eanText])=>{
    const maxx=parseMaxx(maxxText);
    const magento=parseMagento(magText);
    let eanMap=eanText?parseProductRegister(eanText):{};
    
    // If no EAN file provided, try loading from hyllytysappi Firebase
    if(!eanText){
      try{
        setState({result:{type:'ok',text:'Haetaan EAN-koodit...'}});
        const snap=await db.ref('files/csv').once('value');
        const csvText=snap.val();
        if(csvText)eanMap=parseProductRegister(csvText);
      }catch(e){}
    }
    
    // Merge: for each Maxx product, add unshipped from Magento
    const products=[];
    for(const vnr in maxx){
      const m=maxx[vnr];
      const mag=magento[vnr]||{unshipped:0};
      const loc=pLoc(m.location);
      if(!loc)continue; // Skip products without valid location
      const expected=Math.round(m.saldo+mag.unshipped);
      const ean=eanMap[vnr]||'';
      products.push({
        vnr,name:m.name,ean,location:m.location,loc,
        saldo:m.saldo,unshipped:mag.unshipped,expected,
        shelfKey:loc.shelfKey
      });
    }
    
    // Group by shelf
    const shelves={};
    products.forEach(p=>{
      if(!shelves[p.shelfKey])shelves[p.shelfKey]={key:p.shelfKey,aisle:p.loc.aisle,shelf:p.loc.shelf,count:0};
      shelves[p.shelfKey].count++;
    });
    
    // Sort shelves by route
    const shelfList=Object.values(shelves).sort((a,b)=>{
      const ai=aisleIdx(a.aisle),bi=aisleIdx(b.aisle);
      if(ai!==bi)return ai-bi;
      return a.shelf.localeCompare(b.shelf,undefined,{numeric:1});
    });
    
    // Load existing Firebase counts
    const existingCounted={};
    for(const vnr in fbCounted){existingCounted[vnr]=fbCounted[vnr].qty}
    
    setState({
      products,shelves:shelfList,phase:'shelfSelect',
      result:{type:'ok',text:`✓ ${products.length} tuotetta, ${shelfList.length} hyllyä`},
      allCounted:existingCounted
    });
    fbSaveProducts(products);
  }).catch(e=>{setState({error:'Virhe: '+e.message,result:null})});
}

function loadFromFB(){
  setState({error:null,result:{type:'ok',text:'Haetaan Firebasesta...'}});
  invRef.child('products').once('value',snap=>{
    const data=snap.val();
    if(!data||!Object.keys(data).length){setState({error:'Ei tuotteita Firebasessa — lataa tiedostot ensin tietokoneella',result:null});return}
    const products=[];
    for(const vnr in data){
      const p=data[vnr];
      const loc=pLoc(p.location||'');
      if(!loc)continue;
      products.push({vnr,name:p.name||'',ean:p.ean||'',location:p.location,loc,expected:p.expected||0,saldo:p.saldo||0,unshipped:p.unshipped||0,shelfKey:loc.shelfKey});
    }
    const shelves={};
    products.forEach(p=>{if(!shelves[p.shelfKey])shelves[p.shelfKey]={key:p.shelfKey,aisle:p.loc.aisle,shelf:p.loc.shelf,count:0};shelves[p.shelfKey].count++});
    const shelfList=Object.values(shelves).sort((a,b)=>{const ai=aisleIdx(a.aisle),bi=aisleIdx(b.aisle);if(ai!==bi)return ai-bi;return a.shelf.localeCompare(b.shelf,undefined,{numeric:1})});
    const existingCounted={};
    for(const vnr in fbCounted){existingCounted[vnr]=fbCounted[vnr].qty}
    setState({products,shelves:shelfList,phase:'shelfSelect',result:{type:'ok',text:`✓ ${products.length} tuotetta Firebasesta`},allCounted:existingCounted});
  });
}

/* ═══════════ SHELF SELECTION ═══════════ */
function selectShelf(key){
  const items=S.products.filter(p=>p.shelfKey===key);
  const sorted=sortByRoute(items);
  setState({
    selectedShelf:key,shelfItems:sorted,currentIdx:0,
    counted:{},phase:'counting',result:null,error:null,camConfirmed:false
  });
  undoStack=[];
  if(S.device==='scanner')setTimeout(()=>{const inp=document.getElementById('inv-scan-field');if(inp)inp.focus()},200);
  else setTimeout(camStart,300);
}

/* ═══════════ COUNTING ═══════════ */
function countItem(vnr,qty){
  const prev=S.counted[vnr];
  const item=S.shelfItems.find(i=>i.vnr===vnr);
  undoStack.push({vnr,prev,idx:S.currentIdx});
  if(undoStack.length>50)undoStack.shift();
  S.counted[vnr]=qty;
  S.allCounted[vnr]=qty;
  fbSaveCount(vnr,qty,item?.name||'',item?.location||'',item?.expected||0);
  
  // Auto-advance if counted
  const cur=S.shelfItems[S.currentIdx];
  if(cur&&cur.vnr===vnr){
    let next=-1;
    for(let i=S.currentIdx+1;i<S.shelfItems.length;i++){
      if(S.counted[S.shelfItems[i].vnr]===undefined){next=i;break}
    }
    if(next!==-1){
      setTimeout(()=>{setState({currentIdx:next,camConfirmed:false});
        if(S.device==='scanner')setTimeout(()=>{const inp=document.getElementById('inv-scan-field');if(inp)inp.focus()},200);
        else setTimeout(camStart,200);
      },600);
    }
  }
  setState({counted:S.counted,allCounted:S.allCounted,result:{type:'ok',text:'✓ '+esc(item?.name||vnr)+': '+qty+' kpl'},camConfirmed:false});
}

function popUndo(){
  if(!undoStack.length)return;
  const u=undoStack.pop();
  if(u.prev===undefined){delete S.counted[u.vnr];delete S.allCounted[u.vnr];fbDeleteCount(u.vnr)}
  else{S.counted[u.vnr]=u.prev;S.allCounted[u.vnr]=u.prev;const item=S.shelfItems?.find(i=>i.vnr===u.vnr);fbSaveCount(u.vnr,u.prev,item?.name||'',item?.location||'',item?.expected||0)}
  setState({counted:S.counted,allCounted:S.allCounted,currentIdx:u.idx,result:{type:'ok',text:'↩ Peruttu'}});
}

function navTo(idx){
  if(idx>=0&&idx<S.shelfItems.length){
    camStop();stopVoice();
    setState({currentIdx:idx,result:null,camConfirmed:false});
    if(S.device==='scanner')setTimeout(()=>{const inp=document.getElementById('inv-scan-field');if(inp)inp.focus()},200);
    else setTimeout(camStart,200);
  }
}

function finishShelf(){
  camStop();stopVoice();
  setState({phase:'shelfSelect',selectedShelf:null,shelfItems:null,result:{type:'ok',text:'✓ Hylly valmis'},camConfirmed:false});
}

/* ═══════════ SPEECH RECOGNITION ═══════════ */
let speechRec=null,speechActive=false,speechVnr=null;

function startVoice(vnr){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){
    setState({result:{type:'fail',text:'Puheentunnistus ei tuettu — syötä käsin'}});return}
  stopVoice();
  speechVnr=vnr;
  
  // Small delay to ensure previous session is fully closed
  setTimeout(function(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    speechRec=new SR();
    speechRec.lang='fi-FI';speechRec.continuous=false;speechRec.interimResults=false;
    speechActive=true;
    
    speechRec.onresult=function(e){
      const text=e.results[0][0].transcript.trim().toLowerCase();
      const numMap={'nolla':0,'yksi':1,'kaksi':2,'kolme':3,'neljä':4,'viisi':5,'kuusi':6,'seitsemän':7,'kahdeksan':8,'yhdeksän':9,'kymmenen':10,
        'yksitoista':11,'kaksitoista':12,'kolmetoista':13,'neljätoista':14,'viisitoista':15,
        'kuusitoista':16,'seitsemäntoista':17,'kahdeksantoista':18,'yhdeksäntoista':19,'kaksikymmentä':20};
      let num=parseInt(text,10);
      if(isNaN(num)&&numMap[text]!==undefined)num=numMap[text];
      if(isNaN(num)){setState({result:{type:'fail',text:'🎤 "'+text+'" — ei tunnistettu'}});speechActive=false;render();return}
      countItem(speechVnr,num);
      speechActive=false;
    };
    speechRec.onerror=function(e){
      if(e.error==='no-speech'||e.error==='aborted'){
        if(speechActive){setTimeout(function(){if(speechActive&&speechRec){try{speechRec.start()}catch(ex){startVoice(vnr)}}},200)}
      } else if(e.error==='not-allowed'){
        speechActive=false;
        setState({result:{type:'fail',text:'🎤 Mikrofoni estetty — tarkista oikeudet'}});
      } else {
        speechActive=false;
        setState({result:{type:'fail',text:'🎤 Virhe: '+e.error}});
      }
    };
    speechRec.onend=function(){
      if(speechActive){setTimeout(function(){if(speechActive){try{speechRec.start()}catch(e){startVoice(vnr);};}},200)}
    };
    try{speechRec.start();setState({result:{type:'ok',text:'🎤 Kuuntelen... sano määrä'}})}
    catch(e){
      // Retry once after delay
      setTimeout(function(){
        try{speechRec.start();setState({result:{type:'ok',text:'🎤 Kuuntelen... sano määrä'}})}
        catch(e2){speechActive=false;setState({result:{type:'fail',text:'🎤 Ei käynnisty — syötä käsin'}})}
      },500);
    }
  },200);
}

function stopVoice(){speechActive=false;if(speechRec){try{speechRec.stop()}catch(e){}try{speechRec.abort()}catch(e){}speechRec=null}}

/* ═══════════ CAMERA SCANNER ═══════════ */
let camStream=null,camRunning=false,camDetector=null,camLast='',camLastT=0;

async function camStart(){
  camStop();
  const v=document.getElementById('inv-cam-video');if(!v)return;
  
  const hasBD='BarcodeDetector' in window;
  if(hasBD)camDetector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','itf','upc_a','upc_e']});
  
  async function tryStream(constraints){
    camStream=await navigator.mediaDevices.getUserMedia(constraints);
    v.srcObject=camStream;
    // iOS needs to wait for loadedmetadata before play
    await new Promise(function(resolve){
      v.onloadedmetadata=function(){resolve()};
      setTimeout(resolve,2000); // fallback timeout
    });
    await v.play();
    camRunning=true;
    if(hasBD){camScan()}
    else{setState({result:{type:'fail',text:'Automaattinen tunnistus ei tuettu — syötä koodi käsin'}})}
  }
  
  try{
    await tryStream({video:{facingMode:{exact:'environment'}}});
  }catch(e1){
    try{
      await tryStream({video:{facingMode:'environment'}});
    }catch(e2){
      try{
        await tryStream({video:true});
      }catch(e3){
        setState({result:{type:'fail',text:'Kamera ei käynnisty — syötä koodi käsin'}});
      }
    }
  }
}
function camScan(){
  if(!camRunning)return;
  const v=document.getElementById('inv-cam-video');if(!v){camRunning=false;return}
  camDetector.detect(v).then(codes=>{
    if(codes.length>0){
      const c=codes[0].rawValue,now=Date.now();
      if(c!==camLast||now-camLastT>2000){
        camLast=c;camLastT=now;
        if(navigator.vibrate)navigator.vibrate(100);
        const fl=document.getElementById('inv-cam-flash');
        if(fl){fl.style.opacity='1';setTimeout(()=>{fl.style.opacity='0'},200)}
        handleCamScan(c);
      }
    }
  }).catch(()=>{});
  if(camRunning)requestAnimationFrame(camScan);
}
function camStop(){camRunning=false;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}camLast='';camLastT=0}

function handleCamScan(code){
  if(!S.shelfItems)return;
  const cur=S.shelfItems[S.currentIdx];
  if(!cur)return;
  const matchEan=(a,b)=>a&&a!=='null'&&b&&(a===b||b.endsWith(a)||a.endsWith(b));
  if(matchEan(cur.ean,code)||cur.vnr===code){
    camStop();
    setState({result:{type:'ok',text:'✓ '+esc(cur.name)+' — sano määrä'},camConfirmed:true});
    setTimeout(function(){startVoice(cur.vnr)},300);
    return;
  }
  const other=S.shelfItems.find(i=>matchEan(i.ean,code)||i.vnr===code);
  if(other){
    const idx=S.shelfItems.indexOf(other);
    camStop();
    setState({currentIdx:idx,result:{type:'ok',text:'→ '+esc(other.name)+' — sano määrä'},camConfirmed:true});
    setTimeout(function(){startVoice(other.vnr)},300);
    return;
  }
  const num=parseInt(code,10);
  if(!isNaN(num)&&code.length<=3){
    camStop();
    countItem(cur.vnr,num);
    return;
  }
  // Mismatch - DON'T stop camera, just show error and keep scanning
  setState({result:{type:'fail',text:'EAN ei täsmää — skannaa uudelleen tai ohita'}});
}

function skipScan(){
  camStop();
  const cur=S.shelfItems?S.shelfItems[S.currentIdx]:null;
  setState({result:null,camConfirmed:true});
  if(cur)startVoice(cur.vnr);
}

/* ═══════════ SCAN INPUT ═══════════ */
function handleScanInput(val){
  if(!val||!S.shelfItems)return;
  // Find item by EAN or VNR
  const item=S.shelfItems.find(i=>(i.ean&&(i.ean===val||val.endsWith(i.ean)||i.ean.endsWith(val)))||i.vnr===val);
  if(item){
    const idx=S.shelfItems.indexOf(item);
    setState({currentIdx:idx,result:{type:'ok',text:'→ '+esc(item.name)}});
  } else {
    setState({result:{type:'fail',text:'EAN/VNR ei löydy tältä hyllyltä'}});
  }
}

/* ═══════════ CSV EXPORT ═══════════ */
function generateCSV(){
  const rows=[['VNR','Nimi','EAN','Paikka','Maxx Saldo','Keräilemätön','Odotettu','Inventoitu','Erotus','Inventoija','Aika']];
  const now=new Date().toLocaleString('fi-FI');
  S.products.forEach(p=>{
    if(S.allCounted[p.vnr]!==undefined){
      const counted=S.allCounted[p.vnr];
      const diff=counted-p.expected;
      rows.push([p.vnr,p.name,p.ean,p.location,p.saldo,p.unshipped,p.expected,counted,diff,currentWorker,now]);
    }
  });
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
}

function generateDeviationCSV(){
  const rows=[['VNR','Nimi','EAN','Paikka','Odotettu','Inventoitu','Erotus','Inventoija']];
  S.products.forEach(p=>{
    if(S.allCounted[p.vnr]!==undefined){
      const counted=S.allCounted[p.vnr];
      const diff=counted-p.expected;
      if(diff!==0)rows.push([p.vnr,p.name,p.ean,p.location,p.expected,counted,diff,currentWorker]);
    }
  });
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
}

function downloadCSV(content,filename){
  const bom='\uFEFF';
  const blob=new Blob([bom+content],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

      h+='<div style="margin-bottom:12px"><div class="flex justify-between" style="font-size:12px;color:#475569;margin-bottom:4px">';
      h+='<span>Hyllyjä: '+shelvesDone+'/'+shelvesTotal+'</span><span>'+shelvesRemaining+' jäljellä ('+shelfPct+'%)</span></div>';
      h+='<div class="progress-bar"><div class="progress-fill" style="width:'+shelfPct+'%"></div></div></div>';
    }
    h+='<div class="flex gap-8 mb-8"><button class="btn-sm btn-outline flex-1" onclick="dlViewCSV()">Erot CSV</button>';
    h+='<button class="btn-sm btn-outline flex-1" onclick="dlAllCSV()">Kaikki CSV</button></div></div>';

    h+='<details class="card"><summary style="font-size:14px;font-weight:600;color:#7c3aed;cursor:pointer">Lataa/päivitä tiedostot</summary><div style="margin-top:8px">';
    h+='<div class="mb-8"><label class="label">Maxx saldo</label><input type="file" id="v-maxx" accept=".csv" style="font-size:13px;width:100%"></div>';
    h+='<div class="mb-8"><label class="label">Keräilemätön</label><input type="file" id="v-mag" accept=".csv" style="font-size:13px;width:100%"></div>';
    h+='<div class="mb-8"><label class="label">EAN (valinnainen)</label><input type="file" id="v-ean" accept=".csv" style="font-size:13px;width:100%"></div>';
    h+='<button id="v-upload-btn" class="btn" style="background:#6d28d9" onclick="uploadFromDesktop()">Lataa Firebaseen</button></div></details>';

    if(devs.length){for(var i=0;i<devs.length;i++){var d=devs[i];
      h+='<div class="deviation '+(d.diff>0?'dev-plus':'dev-minus')+'">';
      h+='<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12px">'+esc(d.name)+'</div>';
      h+='<div class="mono" style="color:#64748b">'+d.location+' | VNR '+d.vnr+'</div>';
      h+='<div style="font-size:11px;color:#94a3b8">'+d.worker+'</div></div>';
      h+='<div style="text-align:right;white-space:nowrap;margin-left:8px"><div style="font-weight:700">'+d.counted+' / '+d.expected+'</div>';
      h+='<div style="font-size:14px;font-weight:700">'+(d.diff>0?'+':'')+d.diff+'</div></div></div>';
    }}else if(totalCounted>0){h+='<div class="card" style="text-align:center;padding:24px"><div style="font-size:36px;margin-bottom:8px">✓</div><h2 style="color:#16a34a">Ei eroja</h2></div>';
    }else if(!totalProducts){h+='<div class="card" style="text-align:center;padding:24px;color:#94a3b8">Ei dataa — avaa "Lataa tiedostot" yllä</div>';
    }else{h+='<div class="card" style="text-align:center;padding:24px;color:#94a3b8">Inventointia ei aloitettu</div>'}
    h+='<div style="text-align:center;margin-top:12px;font-size:11px;color:#94a3b8">Päivittyy automaattisesti</div>';
    app.innerHTML=h;
  };
}

render();
</script>
</body>
</html>
